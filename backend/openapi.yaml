openapi: 3.0.3
info:
  title: AI-buddy Backend · Вход
  version: 0.1.0
servers:
  - url: http://backend:8080
security:
  - buddyKey: []
paths:
  /health:
    get:
      security: []
      summary: Живость процесса; действующий контракт stage=0
      responses:
        '200':
          description: status=ok, service=backend, stage=0
  /ready:
    get:
      security: []
      summary: Готовность БД
      responses:
        '200':
          description: БД доступна
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/bind:
    post:
      summary: Погасить приглашение и привязать Telegram в личном чате
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, telegram_user_id, telegram_chat_id]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
                telegram_user_id:
                  type: integer
                  format: int64
                  minimum: 1
                telegram_chat_id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Должен совпадать с telegram_user_id
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/telegram/{id}:
    get:
      summary: Найти связанный профиль по Telegram ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    buddyKey:
      type: apiKey
      in: header
      name: X-Buddy-Key
  schemas:
    Profile:
      type: object
      additionalProperties: false
      required: [user_id, display_name, role, team_id]
      properties:
        user_id:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [intern, mentor, teamlead]
        team_id:
          type: string
        mentor_id:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_invitation, unauthorized, not_found, binding_conflict, unavailable]
            message:
              type: string
  responses:
    Profile:
      description: Привязанный профиль из БД
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
    Error:
      description: Ошибка без секретов и подробностей драйвера; code описан в backend/README.md
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
