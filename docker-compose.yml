name: ai-buddy
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buddy
      POSTGRES_DB: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy_local_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U buddy -d buddy']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: buddy
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-buddy_local_demo}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-buddy_metrics_local_demo}
      GRAFANA_VIEWER_PASSWORD: ${GRAFANA_VIEWER_PASSWORD:-buddy_viewer_local_demo}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    read_only: true
    build: ./backend
    environment:
      HTTP_ADDR: ':8080'
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: buddy
      PGDATABASE: buddy
      PGPASSWORD: ${POSTGRES_PASSWORD:-buddy_local_demo}
      PGSSLMODE: disable
      BUDDY_SERVICE_KEY: ${BUDDY_SERVICE_KEY:-buddy_local_demo}
      FEATURE_ACCESS_MONITORING: ${FEATURE_ACCESS_MONITORING:-true}
      FEATURE_TEAM_ESCALATION: ${FEATURE_TEAM_ESCALATION:-true}
      FEATURE_FAQ_PUBLICATION: ${FEATURE_FAQ_PUBLICATION:-true}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_TEAM_ID: ${GITHUB_TEAM_ID:-demo-orders}
      GITHUB_CATALOG_OBJECT_ID: ${GITHUB_CATALOG_OBJECT_ID:-demo-orders-github}
      GITHUB_USER_LOGINS: ${GITHUB_USER_LOGINS:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-buddy_metrics_local_demo}
    volumes:
      - ./seed:/seed:ro
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ready']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  agent:
    read_only: true
    init: true
    build:
      context: ./agent
      args:
        AGENT_EXTRAS: ${AGENT_EXTRAS:-}
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      BACKEND_URL: http://backend:8080
      BUDDY_SERVICE_KEY: ${BUDDY_SERVICE_KEY:-buddy_local_demo}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_READ_ONLY: '1'
      MCP_ATLASSIAN_URL: http://mcp-atlassian:8000/mcp/
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      MCP_CALENDAR_URL: http://google-calendar-mcp:3000/mcp
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-openrouter/auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
      RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-bm25}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://buddy:${POSTGRES_PASSWORD:-buddy_local_demo}@postgres:5432/buddy}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.82}
      BRIEF_TIME: ${BRIEF_TIME:-09:30}
      BRIEF_TIMEZONE: ${BRIEF_TIMEZONE:-Europe/Moscow}
      REDIRECT_BASE_URL: ${REDIRECT_BASE_URL:-}
      AGENT_ENGINE: ${AGENT_ENGINE:-graph}
      AGENT_MODE: ${AGENT_MODE:-agent}
      LLM_IN_DEMO: ${LLM_IN_DEMO:-false}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_MAX_TURNS: ${MEMORY_MAX_TURNS:-6}
      MEMORY_TTL_SECONDS: ${MEMORY_TTL_SECONDS:-1800}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - hf_models:/models
    ports:
      - '127.0.0.1:${AGENT_PORT:-8081}:8081'
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  grafana_data:
  hf_models:
