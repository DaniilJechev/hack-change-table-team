[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-buddy-agent"
version = "0.1.0"
description = "AI-buddy onboarding assistant: briefs, access, team, playbook and presentation review"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "aiohttp>=3.11,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "langgraph>=1.0,<2",
  # FR-AG-10: `traceable` marks LLM calls; it does nothing unless LANGSMITH_TRACING is on.
  "langsmith>=0.4",
  "mcp>=1.28,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "PyYAML>=6,<7",
  # FR-MEM-06: dialog memory in live mode (the compose Redis); demo and tests keep it in process.
  "redis>=5.2,<8",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1"]
# `make studio`: LangGraph dev server (`langgraph dev`) for LangGraph Studio; local only, not in the image.
studio = ["langgraph-cli[inmem]>=0.4,<1"]
# Only for RAG_SEARCH_MODE=vector|rrf: local embeddings and pgvector access. BM25 mode needs none of it.
rag = ["sentence-transformers>=3.4,<6", "torch>=2.4", "psycopg[binary]>=3.2,<4"]

# CPU-only torch: no CUDA libraries (several GB) on a laptop or in the agent image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
buddy = "buddy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["buddy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["buddy"]

[tool.coverage.report]
fail_under = 80.01
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["buddy"]
# The repository mcp/ directory contains config, not a Python package.
known-third-party = ["mcp"]
