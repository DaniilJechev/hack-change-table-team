[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-agent"
version = "0.0.0"
description = "AI-buddy agent scaffold"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.0.0"]

[tool.setuptools.packages.find]
include = ["buddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["buddy"]

[tool.coverage.report]
show_missing = true
