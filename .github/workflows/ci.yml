name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false # No external modules in the stage-zero stub.
      - name: Format and vet
        run: |
          test -z "$(gofmt -l backend)"
          cd backend
          go vet ./...
      - name: Test and measure backend coverage
        run: make cover-go
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: reports/backend/
          if-no-files-found: error

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install -e './agent[dev]'
      - name: Test and measure agent coverage
        run: make cover-agent PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: reports/agent/
          if-no-files-found: error

  specifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make validate-specs

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make check-config
      - name: NFR-BOOT-1 Start all five services without external credentials
        run: make up
      - name: NFR-HEALTH-1 Check backend, agent and pgvector
        run: make smoke
      - name: NFR-ENV-1 Check demo and agent environment
        env:
          LLM_PROVIDER: synthetic-ci-provider
          LLM_MODEL: synthetic-ci-model
          LLM_API_KEY: synthetic-ci-key
          EMBEDDINGS_MODEL: synthetic-ci-embeddings
        run: |
          make demo
          make smoke SMOKE_ARGS=--demo
          docker compose exec -T agent python -c "import os; assert os.environ['LLM_PROVIDER'] == 'synthetic-ci-provider'; assert os.environ['LLM_MODEL'] == 'synthetic-ci-model'; assert os.environ['LLM_API_KEY'] == 'synthetic-ci-key'; assert os.environ['EMBEDDINGS_MODEL'] == 'synthetic-ci-embeddings'"
      - name: Container state and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop services
        if: always()
        run: make down
