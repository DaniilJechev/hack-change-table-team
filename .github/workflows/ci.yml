name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --project agent --frozen --extra dev
      - run: python scripts/check.py coverage
      - run: uv run --project agent --frozen --extra dev ruff check agent scripts
      - run: uv run --project agent --frozen python -m buddy --smoke
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @fission-ai/openspec@1.17.0
      - run: openspec validate --all
        env:
          OPENSPEC_TELEMETRY: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage.out
            reports/python-coverage.xml
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 180
      - run: python scripts/compose_smoke.py
      - run: docker compose exec -T postgres psql -U buddy -d buddy -Atc "SELECT extname FROM pg_extension WHERE extname='vector'"
      - run: docker compose exec -T agent python -m buddy --smoke
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
