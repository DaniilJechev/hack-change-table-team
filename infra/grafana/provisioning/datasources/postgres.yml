apiVersion: 1
datasources:
  - name: AI-buddy aggregates
    uid: buddy-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: buddy_metrics
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: buddy
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 3
      maxIdleConns: 1
      timescaledb: false
