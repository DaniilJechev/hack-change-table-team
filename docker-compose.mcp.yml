# Opt in explicitly: docker compose -f docker-compose.yml -f docker-compose.mcp.yml ...
services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:0.24.1
    init: true
    read_only: true
    ports:
      - '127.0.0.1:${MCP_ATLASSIAN_PORT:-8000}:8000'
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    environment:
      TRANSPORT: streamable-http
      HOST: 0.0.0.0
      PORT: '8000'
      READ_ONLY_MODE: 'true'
      ENABLED_TOOLS: jira_search,jira_get_issue,jira_search_assignable_users,jira_get_user_profile,jira_get_all_projects
      JIRA_URL: ${JIRA_URL:?Set JIRA_URL in .env}
      JIRA_USERNAME: ${JIRA_USERNAME:?Set JIRA_USERNAME in .env}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:?Set JIRA_API_TOKEN in .env}
      HOME: /tmp
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  google-calendar-mcp:
    build: ./mcp/google-calendar
    init: true
    read_only: true
    ports:
      - '127.0.0.1:${MCP_CALENDAR_PORT:-3001}:3000'
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: '3000'
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:?Set GOOGLE_SERVICE_ACCOUNT_JSON in .env}
      ENABLED_TOOLS: list-events,search-events,get-event,list-calendars,get-freebusy,get-current-time
      HOME: /tmp
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
